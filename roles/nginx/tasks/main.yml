---
- name: Install nginx
  apt:
    name: nginx
    state: present

- name: Deploy hardened nginx.conf
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Deploy site config
  template:
    src: default_site.conf.j2
    dest: /etc/nginx/sites-available/default
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Ensure nginx is running and enabled
  service:
    name: nginx
    state: started
    enabled: true
